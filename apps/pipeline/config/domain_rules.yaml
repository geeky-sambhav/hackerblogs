# Site keys / host suffixes that are never article sources. A rule matches a
# site key when it is equal to it or the key ends with "." + rule. Rules that
# start with "=" match the exact key only (platform roots whose subdomains are
# independent blogs, e.g. "=substack.com" excludes substack.com but not
# foo.substack.com). Rules that start with "^" match the start of the host name
# (e.g. "^docs." excludes docs.example.com).
exclude:
  # code, docs, packages
  - github.com
  - gist.github.com
  - gitlab.com
  - bitbucket.org
  - sourceforge.net
  - npmjs.com
  - pypi.org
  - crates.io
  - pkg.go.dev
  - stackoverflow.com
  - stackexchange.com
  - readthedocs.io
  - readthedocs.org
  - docs.google.com
  - drive.google.com
  - developer.mozilla.org
  - developer.apple.com
  - learn.microsoft.com
  - docs.microsoft.com
  - docs.python.org
  - huggingface.co
  # reference, papers
  - wikipedia.org
  - wikimedia.org
  - wiktionary.org
  - wikiquote.org
  - wikisource.org
  - arxiv.org
  - doi.org
  - ncbi.nlm.nih.gov
  - sciencedirect.com
  - researchgate.net
  - ssrn.com
  - papers.ssrn.com
  - jstor.org
